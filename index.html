<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173b57">
    <meta name="description" content="Een eenvoudige offline bingo-app voor 75 of 90 getallen.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bingo">
    <title>Bingo</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1 id="app-title">Bingo</h1>
        <p id="game-status" class="game-status" role="status" aria-live="polite">Kies een spel</p>
      </header>

      <section id="game-choice" class="choice-card" aria-labelledby="choice-heading">
        <p class="choice-eyebrow">Nieuw spel</p>
        <h2 id="choice-heading">Hoeveel getallen?</h2>
        <p class="choice-help">Kies de bingovariant die je wilt spelen.</p>
        <div class="choice-buttons">
          <button class="button choice-button" type="button" data-max-number="75">
            <strong>75</strong>
            <span>getallen</span>
          </button>
          <button class="button choice-button" type="button" data-max-number="90">
            <strong>90</strong>
            <span>getallen</span>
          </button>
        </div>
      </section>

      <div id="game-area" hidden>
        <section class="current-card" aria-labelledby="current-label">
          <p id="current-label" class="current-label">Huidig getal</p>
          <div id="current-number" class="current-number" aria-live="polite" aria-atomic="true">–</div>
        </section>

        <div class="tempo-control">
          <label for="tempo-select">Tempo</label>
          <select id="tempo-select">
            <option value="2">Snel · 2 seconden</option>
            <option value="3">Normaal · 3 seconden</option>
            <option value="5">Rustig · 5 seconden</option>
            <option value="10">Langzaam · 10 seconden</option>
          </select>
        </div>

        <section class="controls" aria-label="Spelbediening">
          <button id="play-button" class="button button-primary" type="button">Start</button>
          <button id="reset-button" class="button button-secondary" type="button">Nieuw spel</button>
        </section>

        <section class="history" aria-labelledby="history-heading">
          <div class="history-heading-row">
            <h2 id="history-heading">Getrokken getallen</h2>
            <div class="history-heading-actions">
              <span id="draw-count" class="draw-count">0</span>
              <label class="history-toggle">
                <input id="history-toggle" type="checkbox" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <span>Tonen</span>
              </label>
            </div>
          </div>
          <div id="number-grid" class="number-grid"></div>
        </section>
      </div>
    </main>

    <noscript>Schakel JavaScript in om Bingo te gebruiken.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
